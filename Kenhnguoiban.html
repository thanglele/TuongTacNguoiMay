<!DOCTYPE html>
<html lang="vi-vn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Garden - Trang chủ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style_Kenhnguoiban.css" />
  </head>
  <body>
    <!-- Header -->
  <div class="thanh-dau-trang" id="header"></div>

  
  <div class="bo-cuc-hai-cot">
    <!-- Sidebar bên trái -->
    <aside class="cot-ben-trai" id="sidebar"></aside>

    <!-- Nội dung bên phải -->
    <div class="cot-ben-phai">
      <!-- Breadcrumb -->
      <div class="khoi-duong-dan" id="duongdan"></div>
      <div  id="timkiem"></div>


      <!-- Nội dung chính -->
      <main class="khoi-noi-dung">
        <!-- Nội dung -->
         <div  id="bang-san-pham"></div>
         <div id="popup-container"></div>
      </main>
    </div>
  </div>

  <!-- Footer -->
  <div class="chan-trang" id="footer"></div>
    <script>
     fetch('./Composite/KenhNguoiban/header_Kenhnguoiban.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header').innerHTML = data;

      const script = document.createElement("script");
      script.src = "./js/script_account.js";
      document.body.appendChild(script);
    });
    </script>
    
    <script>
     fetch('./Composite/KenhNguoiban/khoitimkiem.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('timkiem').innerHTML = data;

      const script = document.createElement("script");
      script.src = "./js/Timkiem.js";
      document.body.appendChild(script);
    });
    </script>

    <script>
    fetch('./Composite/KenhNguoiban/Sidebar.html')
    .then(res => res.text())
    .then(data => { 
      document.getElementById('sidebar').innerHTML = data;

      // Tải script xử lý sidebar sau khi HTML được render xong
      const script = document.createElement("script");
      script.src = "./js/scripts_sidebar.js";
      document.body.appendChild(script);
    });
    </script>

    <script>
     fetch('./Composite/KenhNguoiban/Duongdan.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('duongdan').innerHTML = data;

      const script = document.createElement("script");
      script.src = "./js/Duongdan.js";
      document.body.appendChild(script);
    });
    </script>
<!-- Popup thêm sản phẩm -->
   <script>
function openPopup() {
  fetch('./Composite/Nhaplieu/Nhap-Themsanpham.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('popup-container').innerHTML = html;
      document.body.classList.add('no-scroll');
    });
}

function closePopup() {
  document.getElementById('popup-container').innerHTML = '';
  document.body.classList.remove('no-scroll');
}

</script>

    <!-- Popup cap nhật -->
     <script>function openEditPopup(id) {
  console.log("Đang mở popup cập nhật với ID:", id);

  fetch('./Composite/Nhaplieu/Nhap-Capnhatsanpham.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('popup-container').innerHTML = html;
      console.log("Đã load HTML cập nhật");

      const script = document.createElement("script");
      script.src = "./js/popup_sua.js";
      script.onload = () => {
        console.log("Đã load JS sửa");
        if (typeof openPopup === "function") {
          openPopup(id);
        } else {
          console.error("Hàm openPopup không tồn tại!");
        }
      };
      document.body.appendChild(script);
    })
    .catch(err => {
      console.error("Lỗi khi tải popup cập nhật:", err);
    });
}
</script>


      <script>
        function openDeletePopup(id) {
  fetch('./Composite/Tb-QLSP/canhbao_Xoasanpham.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('popup-container').innerHTML = html;

     
      const overlay = document.querySelector('.modal-overlay');
      overlay.style.display = 'flex';

    
      document.querySelector('.close-button').onclick = () => {
        overlay.remove();
      };

      
      document.querySelector('.cancel-button').onclick = () => {
        overlay.remove();
      };

      
      document.querySelector('.confirm-button').onclick = () => {
        console.log("Xóa sản phẩm ID:", id);
        overlay.remove(); 
      };
    });
}

      </script>

    <script src="./js/scipts_Kenhnguoiban.js"></script>
  </body>
</html>
