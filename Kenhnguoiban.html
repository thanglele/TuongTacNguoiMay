    .then(res => {
      if (!res.ok) {
        throw new Error(`HTTP error! status: ${res.status}`);
      }
      return res.text();
    })
    .then(html => {
      // Đặt HTML vào container
      const popupContainer = document.getElementById('popup-container');
      if (!popupContainer) {
        console.error("Không tìm thấy popup-container");
        return;
      }
      
      popupContainer.innerHTML = html;
      
      // Tạo và thêm script
      const existingScript = document.querySelector('script[src="./js/popup_sua.js"]');
      if (existingScript) {
        existingScript.remove(); // Xóa script cũ nếu có
      }

      <script>
        function openDeletePopup(id) {
    fetch('./Composite/Tb-QLSP/canhbao_Xoasanpham.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('popup-container').innerHTML = html;

     
      const overlay = document.querySelector('.modal-overlay');
      overlay.style.display = 'flex';

    
      document.querySelector('.close-button').onclick = () => {
        overlay.remove();
      };

      
      document.querySelector('.cancel-button').onclick = () => {
        overlay.remove();
      };

      
      document.querySelector('.confirm-button').onclick = () => {
        console.log("Xóa sản phẩm ID:", id);
        overlay.remove(); 
      };
    });
}
