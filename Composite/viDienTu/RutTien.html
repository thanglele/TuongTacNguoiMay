<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Rút Tiền</title>
    <link rel="stylesheet" href="../../css/viDienTu/styles_NapTien.css" />
    <link rel="stylesheet" href="../../css/styles_header.css" />
    <link rel="stylesheet" href="../../css/styles_footer.css" />
  </head>
  <body>
    <div class="main-container">
      <div id="header"></div>

      <div class="breadcrumb-container">
        <div class="breadcrumb">
          <a href="../../index.html" class="link">Trang chủ</a>
          <span class="divider">&gt;</span>
          <a href="./index.html" class="link">Ví Điện Tử</a>
          <span class="divider">&gt;</span>
          <span class="link current">Rút tiền</span>
        </div>
      </div>

      <h2 class="title">Rút tiền từ ví</h2>

      <div class="form-group">
        <label for="phuong-thuc">Phương thức rút</label>
        <select id="phuong-thuc">
          <option value="">Chọn ví hoặc tài khoản</option>
          <option value="momo">Ví MoMo</option>
          <option value="bank">Tài khoản ngân hàng</option>
        </select>
      </div>

      <div class="form-group">
        <label for="so-tien">Số tiền:</label>
        <input type="number" id="so-tien" placeholder="Nhập số tiền" />
      </div>

      <button class="submit-btn">Rút tiền</button>

      <div id="footer"></div>
    </div>

    <script>
      document.querySelector(".submit-btn").addEventListener("click", () => {
        const soTien = document.getElementById("so-tien").value.trim();
        const phuongThuc = document.getElementById("phuong-thuc").value;
        const soDu = Number(localStorage.getItem("soDuVi")) || 0;

        if (!phuongThuc || !soTien || Number(soTien) <= 0) {
          alert("Vui lòng nhập số tiền hợp lệ và chọn phương thức rút.");
          return;
        }

        if (Number(soTien) > soDu) {
          alert("Số dư ví không đủ để rút.");
          return;
        }

        fetch("../../Composite/E_Wallet/Alert_PassRutTien.html")
          .then((res) => res.text())
          .then((html) => {
            if (!document.getElementById("alertModal")) {
              document.body.insertAdjacentHTML("beforeend", html);
              setTimeout(() => {
                window.xacNhanMatKhau = function () {
                  const password = document.getElementById("passwordInput").value;
                  if (password.trim() === "") {
                    alert("Vui lòng nhập mật khẩu");
                    return;
                  }

                  localStorage.setItem(
                    "pendingRutTien",
                    JSON.stringify({ soTien, phuongThuc })
                  );

                  let currentBalance = Number(localStorage.getItem("soDuVi")) || 0;
                  currentBalance -= Number(soTien);
                  localStorage.setItem("soDuVi", currentBalance);

                  localStorage.setItem(
                    "thanhCongRut",
                    JSON.stringify({ soTien })
                  );

                  closeAlert();
                  window.location.href = "./index.html";
                };

                window.closeAlert = function () {
                  const alert = document.getElementById("alertModal");
                  if (alert) alert.remove();
                };
              }, 100);
            }
          })
          .catch((err) => console.error("Không thể tải modal:", err));
      });

      fetch("../header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        });

      fetch("../footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>
