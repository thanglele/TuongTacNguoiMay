<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ví Điện Tử - Mở Ví</title>

    <!-- Fonts + CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/styles_header.css" />
    <link rel="stylesheet" href="../../css/styles_footer.css" />
    <link rel="stylesheet" href="../../css/viDienTu/styles_MoVi.css" />
  </head>

  <body>
    <div class="main-container">
      <div id="header"></div>

      <!-- Breadcrumb -->
      <div class="breadcrumb-container">
        <div class="breadcrumb">
          <a href="../../index.html" class="link">Trang chủ</a>
          <span class="divider">&gt;</span>
          <a href="./index.html" class="link">Ví Điện Tử</a>
          <span class="divider">&gt;</span>
          <span class="current">Nạp tiền</span>
        </div>
      </div>

      <!-- Chọn phương thức -->
      <div class="lienket-wrapper">
        <p class="lienket-title">Lựa chọn phương thức liên kết:</p>

        <label class="lienket-option">
          <input
            type="radio"
            name="phuongthuc"
            value="vidientu"
            onchange="handleRadioChange(this)"
          />
          Ví điện tử (MoMo, ZaloPay, ViettelPay,...)
        </label>

        <label class="lienket-option">
          <input
            type="radio"
            name="phuongthuc"
            value="nganhang"
            onchange="handleRadioChange(this)"
          />
          Ngân hàng
        </label>

        <!-- Form ví điện tử -->
        <div id="vi-dien-tu-form" style="display: none">
          <div class="form-group">
            <label for="loaiVi"
              >Loại ví liên kết <span style="color: red">*</span></label
            >
            <select id="loaiVi">
              <option value="">Chọn loại ví</option>
              <option>MoMo</option>
              <option>ZaloPay</option>
              <option>ViettelPay</option>
            </select>
            <div id="error-vi" class="error-text" style="display: none">
              Vui lòng chọn ví
            </div>
          </div>

          <div class="form-group">
            <label for="sdt"
              >Số điện thoại liên kết <span style="color: red">*</span></label
            >
            <input id="sdt" type="text" placeholder="Nhập số điện thoại" />
            <div id="error-sdt" class="error-text" style="display: none">
              Vui lòng nhập số điện thoại
            </div>
          </div>
        </div>

        <!-- Form ngân hàng -->
        <div id="form-nganhang" style="display: none">
          <div class="form-group">
            <label for="nganhang"
              >Ngân hàng liên kết <span style="color: red">*</span></label
            >
            <select id="nganhang">
              <option value="">Chọn ngân hàng</option>
              <option>Vietcombank</option>
              <option>TPBank</option>
              <option>ACB</option>
            </select>
            <div id="error-nganhang" class="error-text" style="display: none">
              Vui lòng chọn ngân hàng
            </div>
          </div>

          <div class="form-group">
            <label for="stk"
              >Số tài khoản <span style="color: red">*</span></label
            >
            <input type="text" id="stk" placeholder="Nhập số tài khoản" />
            <div id="error-stk" class="error-text" style="display: none">
              Vui lòng nhập số tài khoản
            </div>
          </div>

          <div class="form-group">
            <label for="ngayhethan"
              >Ngày hết hạn <span style="color: red">*</span></label
            >
            <input type="date" id="ngayhethan" />
            <div id="error-ngayhethan" class="error-text" style="display: none">
              Vui lòng chọn ngày
            </div>
          </div>

          <div class="form-group">
            <label for="sdt-nganhang"
              >Số điện thoại liên kết <span style="color: red">*</span></label
            >
            <input
              type="text"
              id="sdt-nganhang"
              placeholder="Nhập số điện thoại"
            />
            <div
              id="error-sdt-nganhang"
              class="error-text"
              style="display: none"
            >
              Vui lòng nhập số điện thoại
            </div>
          </div>
        </div>

        <button class="next-button" onclick="validateForm()">Tiếp theo</button>
      </div>

      <!-- Chèn Alert Modal -->
      <div id="alert-container"></div>

      <div id="footer"></div>
    </div>

    <script>
      function handleRadioChange(radio) {
        document.getElementById("vi-dien-tu-form").style.display =
          radio.value === "vidientu" ? "block" : "none";
        document.getElementById("form-nganhang").style.display =
          radio.value === "nganhang" ? "block" : "none";
      }

      function validateForm() {
        const method = document.querySelector(
          'input[name="phuongthuc"]:checked'
        )?.value;
        let valid = true;

        if (method === "vidientu") {
          const loaiVi = document.getElementById("loaiVi");
          const sdt = document.getElementById("sdt");
          valid = !!loaiVi.value && !!sdt.value.trim();
          document.getElementById("error-vi").style.display = loaiVi.value
            ? "none"
            : "block";
          document.getElementById("error-sdt").style.display = sdt.value.trim()
            ? "none"
            : "block";
        } else if (method === "nganhang") {
          const nganhang = document.getElementById("nganhang");
          const stk = document.getElementById("stk");
          const ngay = document.getElementById("ngayhethan");
          const sdtNH = document.getElementById("sdt-nganhang");
          valid =
            !!nganhang.value &&
            !!stk.value.trim() &&
            !!ngay.value &&
            !!sdtNH.value.trim();
          document.getElementById("error-nganhang").style.display =
            nganhang.value ? "none" : "block";
          document.getElementById("error-stk").style.display = stk.value.trim()
            ? "none"
            : "block";
          document.getElementById("error-ngayhethan").style.display = ngay.value
            ? "none"
            : "block";
          document.getElementById("error-sdt-nganhang").style.display =
            sdtNH.value.trim() ? "none" : "block";
        } else {
          valid = false;
          alert("Vui lòng chọn phương thức liên kết.");
        }

        if (valid) {
          // Chỉ fetch và hiển thị modal nếu form hợp lệ
          fetch("../../Composite/E_Wallet/Alert_PassMoVi.html")
            .then((res) => res.text())
            .then((data) => {
              document.getElementById("alert-container").innerHTML = data;

              document
                .querySelector(".alert_button_huy")
                .addEventListener("click", closeAlert);

              document
                .querySelector(".alert_button_xac_nhan")
                .addEventListener("click", function () {
                  const password = document
                    .querySelector(".text_box")
                    .value.trim();
                  if (!password) {
                    alert("Vui lòng nhập mật khẩu!");
                    return;
                  }
                  localStorage.setItem("thongBaoMoVi", "true");
                  localStorage.setItem("viDaMo", "true");

                  closeAlert();
                  window.location.href = "../viDienTu/index.html";
                });

              document.getElementById("alertModal").style.display = "flex";
            });
        }
      }

      function closeAlert() {
        const modal = document.getElementById("alertModal");
        if (modal) modal.style.display = "none";
      }

      // Load header & footer
      fetch("../header.html")
        .then((res) => res.text())
        .then((data) => (document.getElementById("header").innerHTML = data));
      fetch("../footer.html")
        .then((res) => res.text())
        .then((data) => (document.getElementById("footer").innerHTML = data));
    </script>
  </body>
</html>
