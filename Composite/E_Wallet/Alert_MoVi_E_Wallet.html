<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông báo mở ví</title>

  <!-- Font và CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/E_Wallet/Alert.css" />
</head>

<body>
  <div class="alert-background">
    <div class="alert-e">
      <!-- Nút tắt -->
      <svg id="alert-icon-x" onclick="closeAlert()" xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" fill="none" style="cursor: pointer;">
        <g clip-path="url(#clip0_347_4913)">
          <path d="M4.98092 29.0189C3.35724 27.4507...Z" fill="black"/>
        </g>
        <defs><clipPath id="clip0_347_4913"><rect width="34" height="34" fill="white"/></clipPath></defs>
      </svg>

      <div class="icon-wrapper">
        <svg id="icon" xmlns="http://www.w3.org/2000/svg" width="65" height="65" viewBox="0 0 65 65" fill="none">
          <circle cx="32.5" cy="32.5" r="32.5" fill="#FF2F00" fill-opacity="0.26" />
        </svg>
        <svg id="chamthan" xmlns="http://www.w3.org/2000/svg" width="39" height="39" viewBox="0 0 39 39" fill="none">
          <path d="M19.4998 3.70166C10.7789 3.70166...Z" fill="#FF0000"/>
        </svg>
      </div>

      <div class="alert-overlay">
    <div class="alert-box">
      <div class="alert-close" onclick="window.location.href = '/'">×</div>
      <div class="alert-icon">
        <div class="circle">
          <span class="exclam">!</span>
        </div>
      </div>
      <h2 class="alert-title">Thông báo</h2>
      <p class="alert-message">Bạn cần mở ví để có thể sử dụng các dịch vụ từ ví</p>
      <button class="alert-button" onclick="moViNgay()">Mở ví ngay</button>
    </div>
  </div>

<script>
  function moViNgay() {
    // Đánh dấu đã mở ví
    localStorage.setItem("viDaMo", "true");
    // Chuyển hướng sang trang mở ví
    window.location.href = "../viDienTu/MoVi.html";
  }
</script>

</body>
</html>
