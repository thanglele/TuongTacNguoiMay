<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông báo mở ví thành công</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .wallet-alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #e8fff1;
        border: 1px solid #00c853;
        border-radius: 10px;
        padding: 16px 24px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Roboto", sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease;
      }

      .wallet-alert-icon {
        margin-bottom: 10px;
      }

      .wallet-alert-text {
        color: #2e7d32;
        font-weight: bold;
        font-size: 18px;
        text-align: center;
        margin: 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="wallet-alert" id="wallet-alert">
      <div class="wallet-alert-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#00C853" fill-opacity="0.2" />
          <path
            d="M9.5 12.5L11 14L14.5 10.5"
            stroke="#00C853"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <p class="wallet-alert-text">Chúc mừng bạn đã mở<br />ví thành công</p>
    </div>

    <script>
      setTimeout(() => {
        const alert = document.getElementById("wallet-alert");
        if (alert) {
          alert.style.opacity = "0";
          setTimeout(() => alert.remove(), 500); // chờ hiệu ứng mờ rồi xóa
          
        }
      }, 2500);
      
    </script>
  </body>
</html>
