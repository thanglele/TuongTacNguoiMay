<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/E_Wallet/Alert_ThanhCong.css" />

    <!-- Alert_RutThanhCong.html -->
    <div class="alert-background" id="alertSuccess">
      <div class="alert">
        <div class="icon-wrapper">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="65"
            height="65"
            viewBox="0 0 65 65"
            fill="none"
          >
            <circle
              cx="32.5"
              cy="32.5"
              r="32.5"
              fill="#44FF00"
              fill-opacity="0.26"
            />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="33"
            height="33"
            viewBox="0 0 33 33"
            fill="none"
          >
            <path
              d="M12.4372 16.5002L15.1455 19.2085L21.2393 13.1147"
              stroke="#00B508"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="alert-content">
          <p class="alert-title-sucess" id="thongBaoRut">Rút thành công</p>
        </div>
      </div>
    </div>

    <script>
      const data = JSON.parse(localStorage.getItem("thanhCongRut"));
      if (data && data.soTien) {
        document.getElementById(
          "thongBaoRut"
        ).innerHTML = `Rút thành công<br>${Number(
          data.soTien
        ).toLocaleString()}đ khỏi ví`;

        const soDuCu = parseInt(localStorage.getItem("soDuVi") || "0", 10);
        const soDuMoi = soDuCu - Number(data.soTien);
        localStorage.setItem("soDuVi", soDuMoi.toString());

        localStorage.removeItem("thanhCongRut");
      }

      setTimeout(() => {
        const alert = document.getElementById("alertSuccess");
        if (alert) alert.remove();
      }, 3000);
    </script>
  </body>
</html>
