<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác nhận nạp tiền</title>
    <link rel="stylesheet" href="../../css/E_Wallet/Alert.css" />
  </head>
  <body>
    <!-- Modal xác nhận -->
    <div class="alert-overlay" id="alertModal">
      <div class="alert-box">
        <!-- Nút đóng -->
        <button class="alert-close" onclick="closeAlert()">×</button>

        <!-- Icon cảnh báo -->
        <div class="alert-icon">
          <div class="circle">
            <span class="exclam">!</span>
          </div>
        </div>

        <!-- Tiêu đề và nội dung -->
        <p class="alert-title">Xác thực mật khẩu</p>
        <p class="alert-message">Vui lòng nhập mật khẩu để hoàn tất</p>

        <!-- Ô nhập mật khẩu -->
        <input
          type="password"
          id="passwordInput"
          class="text_box"
          placeholder="Nhập mật khẩu"
          style="
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
          "
        />

        <!-- Nút hành động -->
        <div
          style="
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <button
            class="alert-button alert-button-cancel"
            onclick="closeAlert()"
          >
            Hủy
          </button>
          <button
            class="alert-button alert-button-confirm"
            onclick="xacNhanMatKhau()"
          >
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <!-- Script xử lý -->
    <script>
      function closeAlert() {
        const modal = document.getElementById("alertModal");
        if (modal) modal.remove(); // Xóa modal khỏi DOM
      }

      function xacNhanMatKhau() {
        const mk = document.getElementById("passwordInput").value;
        if (mk.trim() === "") {
          alert("Vui lòng nhập mật khẩu!");
          return;
        }

        // Bạn có thể thực hiện lưu localStorage hoặc fetch API tại đây nếu cần
        const data = JSON.parse(localStorage.getItem("pendingNapTien"));
        if (data && data.soTien) {
          localStorage.setItem(
            "thanhCongNap",
            JSON.stringify({ soTien: data.soTien })
          );
          localStorage.removeItem("pendingNapTien");
          window.location.href = "../viDienTu/index.html";
        }
      }
    </script>
  </body>
</html>
