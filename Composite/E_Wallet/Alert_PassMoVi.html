<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực mở ví</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/E_Wallet/Alert.css" />
  </head>

  <body>
    <!-- 🔔 Alert xác thực mật khẩu -->
    <div class="alert-overlay" id="alertModal" style="display: block">
      <div class="alert-box">
        <!-- Nút đóng góc trên phải -->
        <button class="alert-close" onclick="closeAlert()">×</button>

        <!-- Icon cảnh báo -->
        <div class="alert-icon">
          <div class="circle">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M1 21L12 2L23 21H1ZM4.45 19H19.55L12 6L4.45 19ZM12 18C12.2833 18 12.521 17.904 12.713 17.712C12.905 17.52 13.0007 17.2827 13 17C12.9993 16.7173 12.9033 16.48 12.712 16.288C12.5207 16.096 12.2833 16 12 16C11.7167 16 11.4793 16.096 11.288 16.288C11.0967 16.48 11.0007 16.7173 11 17C10.9993 17.2827 11.0953 17.5203 11.288 17.713C11.4807 17.9057 11.718 18.0013 12 18ZM11 15H13V10H11V15Z"
                fill="#DC6803"
              />
            </svg>
          </div>
        </div>

        <!-- Tiêu đề & mô tả -->
        <p class="alert-title">Xác thực mật khẩu</p>
        <p class="alert-message">Vui lòng nhập mật khẩu để hoàn thành mở ví</p>

        <!-- Ô nhập mật khẩu -->
        <input
          type="password"
          id="passwordInput"
          class="text_box"
          placeholder="Nhập mật khẩu"
          style="
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
          "
        />

        <!-- Nút xác nhận và hủy -->
        <div style="display: flex; justify-content: flex-end; gap: 12px">
          <button class="alert-button alert_button_huy" onclick="closeAlert()">
            Hủy
          </button>

          <button
            class="alert-button alert_button_xac_nhan"
            onclick="xacNhanMatKhau()"
          >
            Xác nhận
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
