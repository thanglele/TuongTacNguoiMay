<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông báo nạp tiền</title>
    <link rel="stylesheet" href="../../css/E_Wallet/Alert_ThanhCong.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="alert-background" id="alertSuccess">
      <div class="alert">
        <div class="icon-wrapper">
          <!-- Icon nền -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="65"
            height="65"
            viewBox="0 0 65 65"
            fill="none"
          >
            <circle
              cx="32.5"
              cy="32.5"
              r="32.5"
              fill="#44FF00"
              fill-opacity="0.26"
            />
          </svg>
          <!-- Icon check -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="33"
            height="33"
            viewBox="0 0 33 33"
            fill="none"
          >
            <path
              d="M12.4372 16.5002L15.1455 19.2085L21.2393 13.1147M10.1808 5.42131C11.2693 5.33445..."
              stroke="#00B508"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="alert-content">
          <p class="alert-title-sucess" id="thongBaoNap">Nạp thành công</p>
        </div>
      </div>
    </div>

    <script>
      const data = JSON.parse(localStorage.getItem("pendingNapTien"));
      if (data && data.soTien) {
        document.getElementById(
          "thongBaoNap"
        ).innerHTML = `Nạp thành công<br>${Number(
          data.soTien
        ).toLocaleString()}đ vào ví`;

        // Cộng vào số dư ví
        const soDuCu = parseInt(localStorage.getItem("soDuVi") || "0", 10);
        const soDuMoi = soDuCu + Number(data.soTien);
        localStorage.setItem("soDuVi", soDuMoi.toString());

        // Xoá dữ liệu tạm
        localStorage.removeItem("pendingNapTien");
      }

      setTimeout(() => {
        const alert = document.getElementById("alertSuccess");
        if (alert) alert.remove();
      }, 3000);
    </script>
  </body>
</html>
