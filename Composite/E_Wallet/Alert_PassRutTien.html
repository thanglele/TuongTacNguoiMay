<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"rel="stylesheet"/>
    <link rel="stylesheet" href="../../css/E_Wallet/Alert.css" />

    <div class="alert-overlay" id="alertModal">
  <div class="alert-box">
    <button class="alert-close" onclick="closeAlert()">×</button>

    <div class="alert-icon">
      <div class="circle">
        <span class="exclam">!</span>
      </div>
    </div>

    <p class="alert-title">Xác thực mật khẩu</p>
    <p class="alert-message">Vui lòng nhập mật khẩu để rút tiền</p>

    <input
      type="password"
      id="passwordInput"
      class="text_box"
      placeholder="Nhập mật khẩu"
      style="width: 100%; padding: 10px; margin-top: 12px; border-radius: 6px; border: 1px solid #ccc;"
    />

    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px;">
      <button class="alert-button alert-button-cancel" onclick="closeAlert()">Hủy</button>
      <button class="alert-button alert-button-confirm" onclick="xacNhanMatKhau()">Xác nhận</button>
    </div>
  </div>
</div>

<script>
  function closeAlert() {
    const modal = document.getElementById("alertModal");
    if (modal) modal.remove();
  }

  function xacNhanMatKhau() {
    const mk = document.getElementById("passwordInput").value;
    if (mk.trim() === "") {
      alert("Vui lòng nhập mật khẩu!");
      return;
    }

    const data = JSON.parse(localStorage.getItem("pendingRutTien"));
    if (data && data.soTien) {
      localStorage.setItem("thanhCongRut", JSON.stringify({ soTien: data.soTien }));
      localStorage.removeItem("pendingRutTien");
      window.location.href = "../viDienTu/index.html";
    }
  }
</script>
</body>
</html>
